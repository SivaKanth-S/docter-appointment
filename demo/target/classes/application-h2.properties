# H2 In-Memory Profile — instant local run without MySQL (College Expo demo)
spring.datasource.url=jdbc:h2:mem:doctor_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

app.jwt.secret=DoctorAppointmentSystemSecretKey2026ExpoSuperSecure256BitKeyMinimumSizeRequiredForHmacSha256!
app.jwt.expiration-ms=86400000
app.rate-limit.requests-per-minute=60
