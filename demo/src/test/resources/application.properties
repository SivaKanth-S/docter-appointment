# Test Configuration - H2 in-memory database (fixes "Access denied for user 'root'" error)
spring.datasource.url=jdbc:h2:mem:doctor_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Security & JWT (same as main)
app.jwt.secret=DoctorAppointmentSystemSecretKey2026ExpoSuperSecure256BitKeyMinimumSizeRequiredForHmacSha256!
app.jwt.expiration-ms=86400000
app.rate-limit.requests-per-minute=60

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
